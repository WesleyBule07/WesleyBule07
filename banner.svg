<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" role="img" aria-label="Wesley Bule, Full-Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040915"/>
      <stop offset="0.45" stop-color="#121A45"/>
      <stop offset="1" stop-color="#0A3F8F"/>
    </linearGradient>
    <radialGradient id="glowPurple" cx="0.82" cy="0.05" r="0.6">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.95" cy="1" r="0.55">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowMagenta" cx="0.05" cy="0.95" r="0.45">
      <stop offset="0" stop-color="#C026D3" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#C026D3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="0.5" cy="0.55" r="0.4">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#8FA8FF" stroke-opacity="0.26" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.25" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.15"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1600" height="560" fill="url(#fade)"/></mask>

    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#E4E1FF"/>
      <stop offset="1" stop-color="#A5D8FF"/>
    </linearGradient>
    <linearGradient id="bracket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C4B5FD" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ruleClip"><rect x="470" y="362" width="660" height="4"/></clipPath>

    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="soft" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="1.2"/></filter>
    <clipPath id="round"><rect width="1600" height="560" rx="84" ry="84"/></clipPath>
  </defs>
  <g clip-path="url(#round)">

  <!-- fundo -->
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#glowPurple)"/>
  <rect width="1600" height="560" fill="url(#glowBlue)"/>
  <rect width="1600" height="560" fill="url(#glowMagenta)"/>
  <rect width="1600" height="560" fill="url(#centerGlow)"/>

  <!-- grade com desvanecimento -->
  <rect width="1600" height="560" fill="url(#grid)" mask="url(#gridMask)"/>

  <!-- circulos concentricos -->
  <g fill="none" stroke="#C4B5FD" stroke-opacity="0.22" stroke-width="1.5">
    <circle cx="1440" cy="40" r="150"/>
    <circle cx="1440" cy="40" r="250"/>
    <circle cx="1440" cy="40" r="360"/>
  </g>
  <g fill="none" stroke="#7DD3FC" stroke-opacity="0.18" stroke-width="1.5">
    <circle cx="140" cy="540" r="130"/>
    <circle cx="140" cy="540" r="230"/>
    <circle cx="140" cy="540" r="340"/>
  </g>

  <!-- particulas -->
  <g fill="#E0E7FF">
    <circle cx="260" cy="120" r="2" opacity="0.6"/>
    <circle cx="420" cy="70" r="1.5" opacity="0.5"/>
    <circle cx="1180" cy="110" r="2" opacity="0.6"/>
    <circle cx="1340" cy="210" r="1.5" opacity="0.5"/>
    <circle cx="1220" cy="480" r="2" opacity="0.5"/>
    <circle cx="380" cy="470" r="1.5" opacity="0.6"/>
    <circle cx="90" cy="250" r="2" opacity="0.4"/>
  </g>

  <!-- colchetes de codigo -->
  <g font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-weight="700" font-size="150" text-anchor="middle">
    <text x="270" y="345" fill="#7C3AED" opacity="0.55" filter="url(#blur)">&lt;</text>
    <text x="1330" y="345" fill="#38BDF8" opacity="0.55" filter="url(#blur)">/&gt;</text>
    <text x="270" y="345" fill="url(#bracket)">&lt;</text>
    <text x="1330" y="345" fill="url(#bracket)">/&gt;</text>
  </g>

  <!-- linha de comentario com cursor -->
  <g font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="26" text-anchor="middle">
    <text x="800" y="196" fill="#9FB4FF">// maputo, moçambique<tspan fill="#38BDF8">_<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
  </g>

  <!-- nome -->
  <g font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
    <text x="800" y="330" font-size="124" font-weight="800" fill="#6366F1" opacity="0.5" filter="url(#blur)" letter-spacing="-2">Wesley Bule</text>
    <text x="800" y="330" font-size="124" font-weight="800" fill="url(#nameFill)" letter-spacing="-2">Wesley Bule</text>
  </g>

  <!-- divisor com brilho que percorre -->
  <rect x="470" y="362" width="660" height="3" rx="1.5" fill="url(#rule)"/>
  <g clip-path="url(#ruleClip)">
    <rect x="-200" y="360" width="200" height="7" fill="url(#sweep)" filter="url(#soft)">
      <animate attributeName="x" values="400;1130" dur="3.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- cargo -->
  <text x="800" y="420" text-anchor="middle" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="500" letter-spacing="7" fill="#DDE6FF">Full-Stack Developer</text>

  <!-- tecnologias -->
  <g font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="600" text-anchor="middle" fill="#F1F5FF">
    <g>
      <rect x="435" y="456" width="200" height="46" rx="23" fill="#0B1230" fill-opacity="0.65" stroke="#4ADE80" stroke-opacity="0.55"/>
      <circle cx="463" cy="479" r="6" fill="#4ADE80"/>
      <text x="557" y="486">Spring Boot</text>
    </g>
    <g>
      <rect x="655" y="456" width="130" height="46" rx="23" fill="#0B1230" fill-opacity="0.65" stroke="#38BDF8" stroke-opacity="0.55"/>
      <circle cx="683" cy="479" r="6" fill="#38BDF8"/>
      <text x="742" y="486">React</text>
    </g>
    <g>
      <rect x="805" y="456" width="190" height="46" rx="23" fill="#0B1230" fill-opacity="0.65" stroke="#60A5FA" stroke-opacity="0.55"/>
      <circle cx="833" cy="479" r="6" fill="#60A5FA"/>
      <text x="922" y="486">TypeScript</text>
    </g>
    <g>
      <rect x="1015" y="456" width="150" height="46" rx="23" fill="#0B1230" fill-opacity="0.65" stroke="#2DD4BF" stroke-opacity="0.55"/>
      <circle cx="1043" cy="479" r="6" fill="#2DD4BF"/>
      <text x="1112" y="486">Django</text>
    </g>
  </g>
  </g>
</svg>
